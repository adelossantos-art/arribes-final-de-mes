</style></head><body><main><section id="app" class="panel"></section><section id="print" class="panel"></section></main><script>
const scenes=[{"day": 1, "title": "On viuràs?", "text": "Tens 22 anys, treballes d’auxiliar administratiu/va a Barcelona i cobres 1.450 € nets. Només tens 30 € en un fons d’emergència. Durant el mes podràs decidir si el fas créixer. Tria habitatge per a aquest mes. Els preus són exemples de mercat, no tarifes oficials.", "opts": [{"label": "Habitació a Sants: 650 € (subministraments inclosos)", "cash": -650, "fund": 0, "well": 1, "feedback": "Tens un trajecte còmode i un cost elevat però previsible.", "opp": "Renuncies a més capacitat d’estalvi a canvi de proximitat.", "flags": {"home": "central", "utilities": true}}, {"label": "Habitació a Nou Barris: 590 € (subministraments a part)", "cash": -590, "fund": 0, "well": 0, "feedback": "Pagues menys lloguer, però hauràs de comptar els rebuts.", "opp": "Renuncies a la comoditat d’un preu amb tot inclòs.", "flags": {"home": "outer", "utilities": false}}, {"label": "Habitació a l’Hospitalet: 540 € (subministraments a part)", "cash": -540, "fund": 0, "well": -1, "feedback": "Tens més marge econòmic, però un trajecte més llarg.", "opp": "Renuncies a temps lliure per reduir el lloguer.", "flags": {"home": "far", "utilities": false}}, {"label": "Estudi per viure sol/a: 1.050 € (subministraments a part)", "cash": -1050, "fund": 0, "well": 2, "feedback": "Guanyes intimitat però compromets bona part del salari.", "opp": "Renuncies a liquiditat i a poder afrontar millor els imprevistos.", "flags": {"home": "solo", "utilities": false}}], "kind": "housing"}, {"day": 2, "title": "Com aniràs a la feina?", "text": "El transport és una despesa recurrent. Tens 22 anys i pots utilitzar la T-jove; en aquest joc imputem un terç del preu trimestral al mes (15,17 €).", "opts": [{"label": "T-jove: cost mensual equivalent de 15,17 €", "cash": -15.17, "fund": 0, "well": 0, "feedback": "Aprofites un abonament de 90 dies.", "opp": "Renuncies a la flexibilitat del vehicle privat.", "flags": {"transport": "public"}}, {"label": "T-usual d’1 zona: 22,80 €", "cash": -22.8, "fund": 0, "well": 0, "feedback": "Tens viatges il·limitats durant 30 dies.", "opp": "Renuncies a l’estalvi potencial de la T-jove.", "flags": {"transport": "public"}}, {"label": "Moto pròpia: 85 € de combustible, assegurança i manteniment imputat", "cash": -85, "fund": 0, "well": 1, "feedback": "Tens flexibilitat, però els costos s’acumulen.", "opp": "Renuncies a 60–70 € que podries reservar.", "flags": {"transport": "moto"}}, {"label": "Bicicleta: 12 € de manteniment", "cash": -12, "fund": 0, "well": -1, "feedback": "És barata, però exigeix temps i adaptació a la ruta.", "opp": "Renuncies a comoditat alguns dies.", "flags": {"transport": "bike"}}], "kind": "transport"}, {"day": 4, "title": "Alimentació: planifica dues setmanes", "text": "Normalment fas la compra cada setmana. Per no repetir quatre vegades la mateixa decisió, tria com gestionaràs les dues compres de les setmanes 1 i 2. Els imports són el total de les dues setmanes.", "opts": [{"label": "Planificar menú i comprar amb llista: 104 €", "cash": -104, "fund": 0, "well": 1, "feedback": "Cobreixes necessitats i controles el malbaratament.", "opp": "Renuncies a comprar alguns productes per impuls.", "flags": {"shop_good": 1}}, {"label": "Comprar sense llista i afegir capricis: 144 €", "cash": -144, "fund": 0, "well": 1, "feedback": "Guanyes comoditat i varietat, però pagues més.", "opp": "Renuncies a estalvi que potser necessitaràs després.", "flags": {"shop_impulse": 1}}, {"label": "Compra molt ajustada: 70 €", "cash": -70, "fund": 0, "well": -2, "feedback": "Redueixes molt la despesa; si es repeteix, pot ser insuficient per a una dieta variada.", "opp": "Renuncies a varietat i qualitat alimentària.", "flags": {"shop_low": 1}}, {"label": "Aprofitar aliments de casa i comprar només el que falta: 68 €", "cash": -68, "fund": 0, "well": 0, "feedback": "Aprofites existències; només és viable si realment tens menjar disponible.", "opp": "Renuncies a varietat immediata i dediques temps a planificar.", "flags": {"shop_pantry": 1}}], "kind": "shop"}, {"day": 6, "title": "Arriben les factures", "text": "Pagues telèfon i, si el lloguer no els inclou, els subministraments. El cost exacte depèn de l’habitatge escollit.", "opts": [{"label": "Tarifa de mòbil econòmica: 12 €; pagar els subministraments que corresponguin", "cash": -12, "fund": 0, "well": 0, "feedback": "Prioritzes una tarifa ajustada.", "opp": "Renuncies a dades extres o serveis que no necessites.", "flags": {"bill": "basic"}}, {"label": "Mòbil amb dades il·limitades: 28 €; pagar els subministraments que corresponguin", "cash": -28, "fund": 0, "well": 1, "feedback": "Tens més serveis, però un cost fix més alt.", "opp": "Renuncies a 16 € mensuals per altres necessitats.", "flags": {"bill": "premium"}}, {"label": "Ajornar els subministraments i pagar el mòbil: 12 €", "cash": -12, "fund": 0, "well": -1, "feedback": "Ajornar no elimina el pagament; s’afegirà un recàrrec fictici de 8 € per al joc.", "opp": "Renuncies a tranquil·litat futura per mantenir liquiditat avui.", "flags": {"bill": "defer"}}], "kind": "bills"}, {"day": 7, "title": "Comences el fons d’emergència", "text": "Vols començar a construir una reserva per a imprevistos. Traspassar diners al fons no és una despesa: continuen sent teus, però els separes del compte habitual. Decideix quant pots reservar sense descuidar les necessitats bàsiques.", "opts": [{"label": "Traspassar 20 € al fons d’emergència", "cash": -20, "fund": 20, "well": 0, "feedback": "Has reservat 20 € per a possibles imprevistos. El teu patrimoni no canvia, però tens menys liquiditat immediata."}, {"label": "Traspassar 50 € al fons d’emergència", "cash": -50, "fund": 50, "well": 0, "feedback": "Has reservat 50 € per a possibles imprevistos. El teu patrimoni no canvia, però tens menys liquiditat immediata."}, {"label": "Traspassar 80 € al fons d’emergència", "cash": -80, "fund": 80, "well": 0, "feedback": "Has reservat 80 € per a possibles imprevistos. El teu patrimoni no canvia, però tens menys liquiditat immediata."}, {"label": "No traspassar diners ara", "cash": 0, "fund": 0, "well": 0, "feedback": "Mantens la liquiditat al compte, però el fons continua sent petit i els imprevistos podrien obligar-te a ajornar pagaments."}], "kind": "saving"}, {"day": 8, "title": "Oferta de feina amb més sou?", "text": "Una altra gestoria t’ofereix 1.580 € nets al mes, però el canvi seria el mes vinent i afegeix 50 minuts de trajecte diari. A la feina actual tens bon ambient i possibilitat de formació.", "opts": [{"label": "Acceptar la nova feina per al mes vinent", "cash": 0, "fund": 0, "well": -1, "feedback": "Guanyaries 130 € nets més al mes, però tindries menys temps personal.", "opp": "Renuncies a la comoditat i l’estabilitat de la feina actual.", "flags": {"job": "new"}}, {"label": "Quedar-te a la feina actual", "cash": 0, "fund": 0, "well": 1, "feedback": "Conserves el temps i l’entorn conegut.", "opp": "Renuncies a un possible augment de 130 € nets mensuals.", "flags": {"job": "stay"}}, {"label": "Demanar una reunió per negociar condicions abans de decidir", "cash": 0, "fund": 0, "well": 0, "feedback": "Busques informació i pots negociar; no hi ha garanties.", "opp": "Renuncies a una decisió ràpida a canvi de reduir incertesa.", "flags": {"job": "negotiate"}}], "kind": "complex"}, {"day": 9, "title": "Una compra temptadora", "text": "El mòbil encara funciona, però hi ha una oferta de 399 € en un model que t’agrada. També et proposen finançament.", "opts": [{"label": "Comprar-lo al comptat: 399 €", "cash": -399, "fund": 0, "well": 2, "feedback": "Gaudeixes del mòbil nou, però perds liquiditat.", "opp": "Renuncies a 399 € per a estalvi, formació o emergències."}, {"label": "Finançar-lo: 39 € ara i 12 quotes futures de 33 €", "cash": -39, "fund": 0, "well": 1, "feedback": "Pagaries 435 € en total, 36 € més que al comptat.", "opp": "Renuncies a una part dels ingressos de 12 mesos futurs.", "debtFuture": 396}, {"label": "Mantenir el mòbil actual: 0 €", "cash": 0, "fund": 0, "well": 0, "feedback": "Conserves liquiditat.", "opp": "Renuncies a les prestacions del model nou."}, {"label": "Comprar un reacondicionat per 165 €", "cash": -165, "fund": 0, "well": 1, "feedback": "Redueixes la despesa, però el teu mòbil actual funcionava.", "opp": "Renuncies a 165 € que podries reservar."}], "kind": "complex"}, {"day": 11, "title": "Una companya necessita ajuda", "text": "Una companya de la gestoria està malalta i et demana que li cobreixis un torn. Aquell vespre tens un compromís personal important. Les hores extres només es paguen si es pacten i es fan dins dels límits legals.", "opts": [{"label": "Acceptar dues hores extres retribuïdes: +28 € nets (supòsit)", "cash": 28, "well": -1, "feedback": "Ingresses 28 €, però renuncies a part del teu temps personal. Abans d’acceptar, comprovaries que les hores s’han acordat i es registren."}, {"label": "Ajudar-la canviant el torn sense fer més hores: 0 €", "cash": 0, "well": 0, "feedback": "Ajudes la companya sense ingressos addicionals, però has de reorganitzar el teu temps."}, {"label": "No acceptar perquè tens un compromís inajornable: 0 €", "cash": 0, "well": 1, "feedback": "Protegeixes el teu compromís, però renuncies a ingressos extres i la companya haurà de buscar una altra solució."}, {"label": "Oferir-te per un altre dia i negociar les condicions: 0 € ara", "cash": 0, "well": 0, "feedback": "No guanyes diners avui, però busques una alternativa que respecti les necessitats de tots."}], "kind": "complex"}, {"day": 13, "title": "Una avaria inesperada", "text": "El portàtil que fas servir per estudiar i fer tràmits s’espatlla. Una reparació fiable costa 180 €. Tens tres alternatives i una opció de préstec.", "opts": [{"label": "Pagar la reparació amb el saldo: 180 €", "cash": -180, "fund": 0, "well": 0, "feedback": "Resolts el problema sense tocar el fons.", "opp": "Renuncies a liquiditat d’aquest mes."}, {"label": "Fer servir 180 € del fons d’emergència", "cash": 0, "fund": -180, "well": 0, "feedback": "Utilitzes els estalvis per a la seva finalitat.", "opp": "Renuncies a protecció davant d’un altre imprevist."}, {"label": "Comprar-ne un de nou per 620 €", "cash": -620, "fund": 0, "well": 2, "feedback": "Tens un equip nou però és una despesa molt superior.", "opp": "Renuncies a 440 € addicionals respecte a reparar."}, {"label": "Demanar un préstec: 0 € ara, 210 € el mes vinent", "cash": 0, "fund": 0, "well": -1, "feedback": "Posposes la despesa amb 30 € de cost addicional.", "opp": "Renuncies a part dels ingressos futurs.", "debtFuture": 210}, {"label": "Demanar un portàtil prestat temporalment i reparar-lo el mes vinent", "cash": 0, "fund": 0, "well": -1, "feedback": "Pots continuar estudiant, però hauràs d’assumir la reparació més endavant.", "opp": "Renuncies a autonomia i trasllades la despesa al mes següent.", "debtFuture": 180}], "kind": "emergency"}, {"day": 15, "title": "Formació o temps lliure?", "text": "Un curs d’Excel avançat de 10 hores costa 95 €. També hi ha una alternativa gratuïta en línia que requereix més autodisciplina.", "opts": [{"label": "Curs presencial: 95 €", "cash": -95, "fund": 0, "well": 2, "feedback": "Inverteixes en competències laborals.", "opp": "Renuncies a 95 € i a temps lliure."}, {"label": "Curs gratuït en línia: 0 €", "cash": 0, "fund": 0, "well": 0, "feedback": "Estalvies diners però necessites organitzar-te.", "opp": "Renuncies a seguiment presencial."}, {"label": "No fer cap curs aquest mes", "cash": 0, "fund": 0, "well": 1, "feedback": "Disposes de més temps i liquiditat.", "opp": "Renuncies a una oportunitat d’aprenentatge."}], "kind": "complex"}, {"day": 17, "title": "Un cap de setmana amb amics", "text": "Et proposen anar dos dies a la Costa Brava. El pressupost inclou transport, allotjament i menjar. Tens alternatives.", "opts": [{"label": "Escapada completa: 185 €", "cash": -185, "fund": 0, "well": 2, "feedback": "Gaudeixes del viatge, però redueixes el marge econòmic.", "opp": "Renuncies a 185 € per a altres objectius."}, {"label": "Excursió d’un dia: 42 €", "cash": -42, "fund": 0, "well": 1, "feedback": "Comparteixes temps amb els amics amb menys despesa.", "opp": "Renuncies a passar-hi la nit."}, {"label": "Pla gratuït a Barcelona: 0 €", "cash": 0, "fund": 0, "well": 0, "feedback": "Mantens vida social sense gastar gaire.", "opp": "Renuncies a l’experiència del viatge."}, {"label": "No quedar i descansar: 0 €", "cash": 0, "fund": 0, "well": 1, "feedback": "Recuperes temps i energia.", "opp": "Renuncies a compartir aquesta experiència amb el grup."}], "kind": "complex"}, {"day": 18, "title": "Alimentació: la inflació es nota", "text": "A les setmanes 3 i 4 continues comprant un cop per setmana, però alguns productes han pujat de preu. Tria com adaptaràs les dues compres a la situació. Els imports són el total de les dues setmanes. Compara els imports amb els de la primera quinzena: una pujada de preus redueix el poder adquisitiu si el salari no augmenta.", "opts": [{"label": "Planificar menú i comprar amb llista: 120 €", "cash": -120, "fund": 0, "well": 1, "feedback": "Cobreixes necessitats i controles el malbaratament.", "opp": "Renuncies a comprar alguns productes per impuls.", "flags": {"shop_good": 1}}, {"label": "Comprar sense llista i afegir capricis: 172 €", "cash": -172, "fund": 0, "well": 1, "feedback": "Guanyes comoditat i varietat, però pagues més.", "opp": "Renuncies a estalvi que potser necessitaràs després.", "flags": {"shop_impulse": 1}}, {"label": "Compra molt ajustada: 84 €", "cash": -84, "fund": 0, "well": -2, "feedback": "Redueixes molt la despesa; si es repeteix, pot ser insuficient per a una dieta variada.", "opp": "Renuncies a varietat i qualitat alimentària.", "flags": {"shop_low": 1}}, {"label": "Aprofitar aliments de casa i comprar només el que falta: 84 €", "cash": -84, "fund": 0, "well": 0, "feedback": "Aprofites existències; només és viable si realment tens menjar disponible.", "opp": "Renuncies a varietat immediata i dediques temps a planificar.", "flags": {"shop_pantry": 1}}], "kind": "shop"}, {"day": 19, "title": "Una segona oportunitat per estalviar", "text": "Vols començar a construir una reserva per a imprevistos. Traspassar diners al fons no és una despesa: continuen sent teus, però els separes del compte habitual. Decideix quant pots reservar sense descuidar les necessitats bàsiques.", "opts": [{"label": "Traspassar 15 € al fons d’emergència", "cash": -15, "fund": 15, "well": 0, "feedback": "Has reservat 15 € per a possibles imprevistos. El teu patrimoni no canvia, però tens menys liquiditat immediata."}, {"label": "Traspassar 35 € al fons d’emergència", "cash": -35, "fund": 35, "well": 0, "feedback": "Has reservat 35 € per a possibles imprevistos. El teu patrimoni no canvia, però tens menys liquiditat immediata."}, {"label": "Traspassar 60 € al fons d’emergència", "cash": -60, "fund": 60, "well": 0, "feedback": "Has reservat 60 € per a possibles imprevistos. El teu patrimoni no canvia, però tens menys liquiditat immediata."}, {"label": "No traspassar diners ara", "cash": 0, "fund": 0, "well": 0, "feedback": "Mantens la liquiditat al compte, però el fons continua sent petit i els imprevistos podrien obligar-te a ajornar pagaments."}], "kind": "saving"}, {"day": 20, "title": "Salut: un imprevist important", "text": "Una visita dental no ajornable i el tractament necessari costen 140 €. Aquesta situació és una despesa privada fictícia, no un preu sanitari oficial.", "opts": [{"label": "Pagar 140 € del saldo", "cash": -140, "fund": 0, "well": 0, "feedback": "Prioritzes la salut.", "opp": "Renuncies a marge per a la resta del mes."}, {"label": "Pagar 140 € amb el fons d’emergència", "cash": 0, "fund": -140, "well": 0, "feedback": "El fons cobreix una necessitat imprevista.", "opp": "Renuncies a una part de la reserva."}, {"label": "Pagar 70 € ara i 75 € el mes vinent", "cash": -70, "fund": 0, "well": -1, "feedback": "El fraccionament té un cost de 5 €.", "opp": "Renuncies a liquiditat futura.", "debtFuture": 75}], "kind": "emergency"}, {"day": 22, "title": "Un ingrés extra amb conseqüències", "text": "Et proposen una feina puntual compatible i legal aquest cap de setmana: cobraries 90 € nets, però perdries un compromís familiar important. També tens l’opció de vendre un objecte que no fas servir.", "opts": [{"label": "Acceptar la feina extra: +90 €", "cash": 90, "fund": 0, "well": -2, "feedback": "Millores el saldo, però renuncies al compromís personal.", "opp": "El cost d’oportunitat és el temps familiar perdut."}, {"label": "Rebutjar la feina i mantenir el compromís", "cash": 0, "fund": 0, "well": 2, "feedback": "Prioritzes les relacions personals.", "opp": "Renuncies als 90 € addicionals."}, {"label": "Vendre un objecte que no utilitzes: +45 €", "cash": 45, "fund": 0, "well": 0, "feedback": "Obtens liquiditat sense treballar el cap de setmana.", "opp": "Renuncies a conservar l’objecte."}, {"label": "Fer la feina i reservar-ne 60 € al fons", "cash": 30, "fund": 60, "well": -2, "feedback": "Augmentes el fons, però sacrifiques temps familiar.", "opp": "Renuncies a 60 € de liquiditat i al compromís familiar."}], "kind": "complex"}, {"day": 24, "title": "Una despesa que no havies previst", "text": "El propietari et comunica que el frigorífic del pis compartit s’ha espatllat. Abans de pagar res, cal aclarir a qui correspon la reparació segons el contracte i la causa de l’avaria.", "opts": [{"label": "Pagar immediatament 160 € de la teva butxaca", "cash": -160, "well": 0, "feedback": "Resolts ràpidament el problema, però renuncies a 160 € i potser has assumit una despesa que no et corresponia."}, {"label": "Revisar el contracte i parlar amb el propietari: 0 € inicials", "cash": 0, "well": 0, "feedback": "Dedicar temps a informar-te evita una despesa precipitada. Potser caldrà acordar una solució provisional."}, {"label": "Acordar amb els companys una reparació urgent de 90 € a repartir entre tres: 30 €", "cash": -30, "well": 1, "feedback": "Compartiu un cost urgent, però renuncies a 30 € i cal aclarir després qui l’ha d’assumir definitivament."}, {"label": "Comprar una nevera nova entre els companys: 130 € per persona", "cash": -130, "well": 1, "feedback": "Teniu una solució ràpida, però comprometeu diners i potser no era necessari comprar un electrodomèstic nou."}], "kind": "complex"}, {"day": 25, "title": "El veterinari: un imprevist amb la teva gossa", "text": "La teva gossa, la Nala, porta dos dies sense menjar bé i està decaiguda. El veterinari recomana una visita i proves. Tens diverses alternatives, però la seva salut no pot esperar indefinidament.", "opts": [{"label": "Fer la visita i les proves recomanades: 175 €", "cash": -175, "fund": 0, "well": 1, "feedback": "Prioritzes la salut de la Nala i resols la incertesa, però disposes de menys diners per a la resta del mes.", "opp": "Deixes de disposar de 175 € per a altres necessitats."}, {"label": "Pagar els 175 € amb el fons d’emergència", "cash": 0, "fund": -175, "well": 1, "feedback": "Afrontes una despesa inesperada amb l’estalvi previst per a emergències, però la reserva es redueix.", "opp": "Tens menys protecció davant de futurs imprevistos."}, {"label": "Fer primer la visita de 55 € i decidir les proves amb el veterinari", "cash": -55, "fund": 0, "well": 0, "feedback": "Obtens una valoració professional inicial. Si calen proves, hauràs de buscar com pagar-les; no és segur que n’hi hagi prou amb la visita.", "opp": "Conserves liquiditat ara, però assumes la possibilitat de més despeses i incertesa."}, {"label": "Ajornar les proves i demanar visita en uns dies: 0 € avui", "cash": 0, "fund": 0, "well": -3, "feedback": "No gastes avui, però retardar l’atenció pot empitjorar el problema i acabar sent més car. Si la Nala empitjora, cal atenció veterinària urgent.", "opp": "Mantens els diners, però renuncies a una valoració veterinària immediata."}, {"label": "Pagar la visita i les proves amb finançament: 35 € ara i 4 quotes de 40 €", "cash": -35, "fund": 0, "well": 1, "feedback": "La Nala rep atenció ara, però el cost total és de 195 € i compromet diners dels mesos següents.", "opp": "Conserves liquiditat avui a canvi de pagar 20 € més i tenir quotes futures.", "debtFuture": 160}], "kind": "emergency"}, {"day": 26, "title": "La Nala i el contracte de lloguer", "text": "El propietari t’informa que vol cobrar 60 € addicionals al mes per tenir la Nala al pis. Abans d’acceptar cap canvi, pots revisar el contracte i informar-te dels teus drets.", "opts": [{"label": "Acceptar pagar 60 € aquest mes", "cash": -60, "well": 0, "feedback": "Evites una discussió immediata, però renuncies a 60 € i el cost podria repetir-se cada mes."}, {"label": "Revisar el contracte i negociar abans de pagar", "cash": 0, "well": 0, "feedback": "No pagues sense comprovar les condicions pactades; hi dediques temps i no tens garantit el resultat."}, {"label": "Buscar una habitació que admeti animals (40 € en visites i desplaçaments)", "cash": -40, "well": -1, "feedback": "Explores alternatives, però gastes 40 € i temps sense garantia de trobar un lloc millor."}, {"label": "Demanar assessorament gratuït sobre el contracte", "cash": 0, "well": 0, "feedback": "Guanyes informació abans de decidir, encara que hauràs d’esperar per resoldre el conflicte."}], "kind": "complex"}, {"day": 27, "title": "Fons d’emergència o liquiditat?", "text": "Arriba el final del mes. Pots tornar a reforçar el fons d’emergència, sempre que conservis prou diners per a les despeses immediates. Recorda que estalviar no és gastar.", "opts": [{"label": "Traspassar 100 € al fons", "cash": -100, "fund": 100, "well": 1, "feedback": "Augmentes la reserva per a futurs imprevistos. Pensa si el saldo que et queda és suficient per als últims dies.", "opp": "Renuncies a 100 € de liquiditat immediata."}, {"label": "Traspassar 40 € al fons", "cash": -40, "fund": 40, "well": 0, "feedback": "Reforces gradualment el fons. Pensa si el saldo que et queda és suficient per als últims dies.", "opp": "Renuncies a 40 € de liquiditat."}, {"label": "No fer cap traspàs", "cash": 0, "fund": 0, "well": 0, "feedback": "Mantens diners al compte. Pensa si el saldo que et queda és suficient per als últims dies.", "opp": "Renuncies a augmentar el fons aquest mes."}], "kind": "saving"}, {"day": 29, "title": "Un compromís amb els amics", "text": "Els amics et proposen anar a un concert que costa 65 € amb transport inclòs. És l’últim cap de setmana del mes i no saps si el mes vinent tindràs despeses imprevistes.", "opts": [{"label": "Anar al concert: 65 €", "cash": -65, "well": 2, "feedback": "Gaudeixes d’una experiència amb els amics, però renuncies a 65 € de marge per al mes vinent."}, {"label": "Proposar un pla alternatiu de 15 €", "cash": -15, "well": 1, "feedback": "Mantens el contacte social i estalvies 50 € respecte al concert, però renuncies a l’espectacle."}, {"label": "No gastar i reservar els diners: 0 €", "cash": 0, "well": -1, "feedback": "Conserves liquiditat, però renuncies a una activitat que et feia il·lusió."}, {"label": "Pagar el concert amb una targeta de crèdit: 0 € avui, 70 € el mes vinent", "cash": 0, "well": 1, "debtFuture": 70, "feedback": "Gaudeixes ara, però renuncies a 70 € del pressupost del mes vinent i pagues 5 € més per ajornar-lo."}], "kind": "complex"}];
const initial={i:-1,cash:1450,fund:30,debtFuture:0,well:5,flags:{},log:[],pendingBill:0,negativeDays:0,essentials:{housing:0,transport:0,food:0,bills:0}};let s=structuredClone(initial);
const $=id=>document.getElementById(id);const euro=n=>Number(n).toLocaleString('ca-ES',{style:'currency',currency:'EUR'});
function stats(){return `<div class="stats"><div class="stat">Compte corrent<strong>${euro(s.cash)}</strong></div><div class="stat">Fons d’emergència<strong>${euro(s.fund)}</strong></div><div class="stat">Deute futur<strong>${euro(s.debtFuture)}</strong></div><div class="stat">Benestar<strong>${Math.max(0,Math.min(10,s.well))}/10</strong></div></div>`}
function intro(){$('app').innerHTML=`<span class="tag">2n CFGM · ECONOMIA DOMÈSTICA</span><h1>Arribes a final de mes?</h1><p>30 dies a Barcelona. Tens 22 anys, una feina d’auxiliar administratiu/va, <b>1.450 € nets de sou</b> i <b>30 € de fons d’emergència</b> acumulats anteriorment.</p>${stats()}<p>Prendràs decisions sobre habitatge, alimentació, inflació, transport, rebuts, formació, oci, deutes i imprevistos. <b>Cada decisió té un cost d’oportunitat:</b> allò a què renuncies quan tries una alternativa.</p><p class="muted small">Simulació educativa amb imports orientatius de Barcelona 2026. El salari, els rebuts i els preus no oficials són supòsits; les tarifes del transport corresponen a 2026. Els diners del fons són estalvis previs, no ingressos del mes.</p><button class="primary" onclick="start()">Començar el mes</button>`}
function start(){s=structuredClone(initial);s.i=0;render()}
function render(){if(s.i>=scenes.length){finish();return}let q=scenes[s.i];$('app').innerHTML=`<div class="no-print"><span class="tag">DIA ${q.day} · DECISIÓ ${s.i+1}/${scenes.length}</span><div class="bar"><div style="width:${100*s.i/scenes.length}%"></div></div>${stats()}<h2>${q.title}</h2><p>${q.text}</p>${q.opts.map((o,j)=>`<button class="option" onclick="choose(${j})">${o.label}</button>`).join('')}<p class="muted small">Els pagaments ajornats al mes següent continuen sent deutes. Si el saldo és negatiu, la partida continua.</p></div>`}
function choose(j){let q=scenes[s.i],o=q.opts[j],cash=o.cash,fund=o.fund,extra='';if(fund<0&&s.fund<(-fund)){let missing=(-fund)-s.fund;cash-=missing;fund=-s.fund;extra=` El fons no era suficient: ${euro(missing)} s’han carregat al compte.`}if(q.kind==='bills'&&!s.flags.utilities){let utilities=82;if(o.flags?.bill==='defer'){s.debtFuture+=90;extra+=' Has ajornat 82 € de subministraments amb un cost total de 90 €.'}else{cash-=utilities;extra+=' Has pagat també 82 € de subministraments.'}}if(q.kind==='bills'&&s.flags.utilities){extra+=' Els subministraments ja estaven inclosos al lloguer.'}if(q.kind==='housing')s.essentials.housing=-cash;
if(q.kind==='transport')s.essentials.transport=-cash;
if(q.kind==='shop')s.essentials.food+=-cash;
if(q.kind==='bills')s.essentials.bills=(-o.cash)+(s.flags.utilities?0:82);
s.cash=Math.round((s.cash+cash)*100)/100;s.fund=Math.round((s.fund+fund)*100)/100;s.well+=o.well||0;s.debtFuture+=(o.debtFuture||0);for(let [k,v] of Object.entries(o.flags||{})){if(typeof v==='number'&&k.startsWith('shop_'))s.flags[k]=(s.flags[k]||0)+v;else s.flags[k]=v}if(s.cash<0)s.negativeDays++;s.log.push({day:q.day,title:q.title,decision:o.label,feedback:o.feedback+extra,opp:o.opp,cash:s.cash,fund:s.fund,debt:s.debtFuture});$('app').innerHTML=`<span class="tag">DIA ${q.day} · RESULTAT DE LA TEVA DECISIÓ</span>${stats()}<div class="feedback"><p>${o.feedback}${extra} ${o.opp}</p></div>${s.cash<0?'<div class="warning">El compte és negatiu. Hauràs de buscar una solució i valorar els riscos d’endeutar-te.</div>':''}<button class="primary" onclick="next()">Continuar</button>`}
function next(){s.i++;render()}
function emergencyCalc(){let e=s.essentials;let monthly=e.housing+e.transport+e.food+e.bills;return {monthly,minimum:monthly*3,ideal:monthly*6,missing:Math.max(0,monthly*3-s.fund)}}
function emergencyQuestion(){let c=emergencyCalc();return `<h2>7. Calcula el teu fons d’emergència recomanat</h2><p>Segons les despeses bàsiques que has escollit durant la partida, el teu cost mensual estimat és:</p><table><tr><th>Despesa bàsica</th><th>Import</th></tr><tr><td>Habitatge</td><td>${euro(s.essentials.housing)}</td></tr><tr><td>Transport necessari</td><td>${euro(s.essentials.transport)}</td></tr><tr><td>Alimentació (4 setmanes)</td><td>${euro(s.essentials.food)}</td></tr><tr><td>Telèfon i subministraments</td><td>${euro(s.essentials.bills)}</td></tr><tr><th>Total de despeses bàsiques mensuals</th><th>${euro(c.monthly)}</th></tr></table><p><b>Calcula:</b> a) Quin fons necessitaries per cobrir 3 mesos de despeses bàsiques? b) I per cobrir-ne 6? c) Quin import et falta per assolir el mínim de 3 mesos, tenint en compte el fons final de ${euro(s.fund)}? d) Proposa una aportació mensual realista i calcula aproximadament quants mesos necessitaries per arribar al mínim.</p><p class="muted small">Per fer el càlcul, utilitza les despeses bàsiques mostrades. No hi incloguis oci, compres opcionals, imprevistos puntuals ni deutes ajornats. Els imports són estimacions de la teva partida; un pressupost real també hauria de considerar altres despeses imprescindibles si n’hi hagués.</p>`}
function finish(){let net=s.cash+s.fund-s.debtFuture;let okay=s.cash>=0&&s.debtFuture===0;let shop=scenes.filter(x=>x.kind==='shop').length;let log=s.log.map(x=>`<tr><td>${x.day}</td><td>${x.title}</td><td>${x.decision}</td><td>${x.feedback} ${x.opp||""}</td></tr>`).join('');$('app').innerHTML=`<span class="tag">DIA 30 · RESULTAT</span><h1>${okay?'Has arribat a final de mes sense deutes nous!':'Has arribat al dia 30 amb decisions pendents'}</h1>${stats()}<p><b>Patrimoni financer net simplificat:</b> ${euro(net)} (compte + fons − deutes futurs). No equival al saldo del compte.</p><p><b>Has planificat ${shop} períodes de compra (dues setmanes cadascun)</b> i ${s.log.length} decisions. ${s.negativeDays?'En algun moment el saldo ha estat negatiu.':'No has entrat en saldo negatiu.'} Recorda que no es tracta només d’acabar amb més diners: també compten salut, alimentació, temps i benestar.</p><h2>Reflexió final</h2><ol><li>Quines dues decisions t’han resultat més difícils? Per què?</li><li>Explica el cost d’oportunitat de dues decisions que has pres.</li><li>Com han afectat la compra setmanal i la inflació al teu pressupost?</li><li>Com t’ha afectat començar el mes amb un fons d’emergència de només 30 €?</li><li>Has ajornat cap pagament? Com afectarà el mes següent?</li><li>Quina decisió canviaries en una segona partida? Justifica-la.</li></ol>${emergencyQuestion()}<button class="primary no-print" onclick="makePrint()">Imprimir o desar la fitxa en PDF</button> <button class="secondary no-print" onclick="start()">Tornar a jugar</button><h2>Historial de decisions</h2><table><tr><th>Dia</th><th>Situació</th><th>Decisió</th><th>Conseqüència i alternativa descartada</th></tr>${log}</table>`}
function makePrint(){const qs=['Quines dues decisions t’han resultat més difícils? Per què?','Explica el cost d’oportunitat de dues decisions que has pres.','Com han afectat la compra setmanal i la inflació al teu pressupost?','Com t’ha afectat començar el mes amb un fons d’emergència de només 30 €?','Has ajornat cap pagament? Com afectarà el mes següent?','Quina decisió canviaries en una segona partida? Justifica-la.'];$('print').innerHTML=`<h1>Arribes a final de mes? · Fitxa de l’alumne</h1><p>Nom: _____________________________________</p><p>Compte: ${euro(s.cash)} · Fons: ${euro(s.fund)} · Deute futur: ${euro(s.debtFuture)}</p><h2>Historial</h2><table><tr><th>Dia</th><th>Situació</th><th>Decisió</th><th>Conseqüència i alternativa descartada</th></tr>${s.log.map(x=>`<tr><td>${x.day}</td><td>${x.title}</td><td>${x.decision}</td><td>${x.feedback} ${x.opp||""}</td></tr>`).join('')}</table><h2>Reflexió</h2>${emergencyQuestion()}${qs.map((q,i)=>`<p><b>${i+1}. ${q}</b></p><div style="height:70px;border-bottom:1px solid #ccc"></div>`).join('')}`;window.print()}
intro();</script></body></html>
